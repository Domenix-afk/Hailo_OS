version: '3.8'

services:
  # Backend Service
  backend:
    image: nero-ai:latest
    container_name: nero-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      - ENVIRONMENT=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - USE_GPU=true
      - COMPUTE_TYPE=float16
      - STT_BEAM_SIZE=3
      - LLM_MAX_TOKENS=120
      - TTS_ENGINE=gtts
      - TTS_TIMEOUT=20
    volumes:
      - nero-temp:/app/temp
      - nero-logs:/app/logs
      - nero-models:/root/.cache  # Model cache for faster restarts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - nero-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: nero-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - nero-network
    restart: unless-stopped

volumes:
  nero-temp:
    driver: local
  nero-logs:
    driver: local
  nero-models:
    driver: local

networks:
  nero-network:
    driver: bridge
